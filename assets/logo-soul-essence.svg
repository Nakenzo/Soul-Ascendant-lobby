<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="500" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Rajdhani:wght@700&amp;display=swap');
      .logo-title {
        font-family: 'Cinzel', 'Trajan Pro', 'Cinzel Decorative', 'Georgia', serif;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 5px;
        text-anchor: middle;
      }
      .logo-sub {
        font-family: 'Rajdhani', 'Outfit', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 7px;
        text-anchor: middle;
      }
    </style>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="logoWingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="logoCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(250, 16)" filter="url(#logoCoreGlow)">
    <polygon points="0,-12 4,-4 12,0 4,4 0,12 -4,4 -12,0 -4,-4" fill="#ffffff"/>
    <circle cx="0" cy="0" r="2.5" fill="#38bdf8"/>
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="url(#logoWingGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="120" y2="0" stroke="url(#logoWingGrad)" stroke-width="1.5" stroke-linecap="round" transform="scale(-1,1)"/>
    <circle cx="-120" cy="0" r="2" fill="#38bdf8"/>
    <circle cx="120" cy="0" r="2" fill="#38bdf8"/>
  </g>

  <text x="250" y="66" class="logo-title" fill="url(#logoTextGrad)">SOUL ESSENCE</text>

  <g transform="translate(250, 88)">
    <line x1="-80" y1="0" x2="-35" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <polygon points="0,-4 3,0 0,4 -3,0" fill="#38bdf8"/>
    <line x1="35" y1="0" x2="80" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="0" y="3.5" class="logo-sub" fill="#94a3b8">ACTION ROGUELIKE</text>
  </g>
</svg>
